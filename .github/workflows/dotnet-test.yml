name: .NET Test Automation Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  API_USERNAME: ${{secrets.API_USERNAME}}
  API_PASSWORD: ${{secrets.API_PASSWORD}}

jobs:
  run-tests:
    runs-on: talos-runners

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to diff against below

      - name: Install kubectl
        run: |
          mkdir -p "$HOME/bin"
          curl -LO "https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl"
          install -m 0755 kubectl "$HOME/bin/kubectl"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/kubectl" version --client

      # Namespace and RBAC are one-time cluster setup applied by an admin
      # kubeconfig (see k8s/README.md) - the runner's own ServiceAccount is
      # deliberately not permitted to touch either (Namespace is cluster-
      # scoped, and letting a "no-permission" identity manage its own RBAC
      # would defeat the point of least-privilege), so this can't and
      # shouldn't be reconciled from inside the pipeline itself.

      - name: Check whether the framework image needs rebuilding
        id: image-deps
        run: |
          if git diff --quiet HEAD^ HEAD -- Dockerfile atp.ApiAutomation.Framework/atp.ApiAutomation.Framework.csproj; then
            echo "Dockerfile and .csproj unchanged since last commit, skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dockerfile or .csproj changed, rebuild needed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push framework image (Kaniko)
        if: steps.image-deps.outputs.changed == 'true'
        run: |
          kubectl delete job kaniko-build -n api-automation --ignore-not-found
          kubectl apply -f k8s/kaniko-build-job.yaml
          kubectl wait --for=condition=complete job/kaniko-build -n api-automation --timeout=10m || \
            (kubectl logs job/kaniko-build -n api-automation; exit 1)
          kubectl logs job/kaniko-build -n api-automation

      - name: Deploy Application Under Test
        run: |
          kubectl apply -f k8s/aut-deployment.yaml
          kubectl apply -f k8s/aut-service.yaml
          kubectl wait --for=condition=available deploy/qa-practice-api -n api-automation --timeout=180s || \
            (kubectl describe deploy/qa-practice-api -n api-automation; exit 1)

      # The test Job itself and report retrieval are not wired up yet - next
      # step in the migration to the Talos cluster.

      - name: Tear down Application Under Test
        if: always()
        run: |
          kubectl delete -f k8s/aut-deployment.yaml -f k8s/aut-service.yaml --ignore-not-found
