name: .NET Test Automation Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  API_USERNAME: ${{secrets.API_USERNAME}}
  API_PASSWORD: ${{secrets.API_PASSWORD}}

jobs:
  run-tests:
    runs-on: talos-runners
    permissions:
      contents: write # Needed for uploading artifacts and other file operations
      pages: write    # Needed for deploying to GitHub Pages
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to diff against below

      - name: Install kubectl
        run: |
          mkdir -p "$HOME/bin"
          curl -LO "https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl"
          install -m 0755 kubectl "$HOME/bin/kubectl"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/kubectl" version --client

      # Namespace and RBAC are one-time cluster setup applied by an admin
      # kubeconfig (see k8s/README.md) - the runner's own ServiceAccount is
      # deliberately not permitted to touch either (Namespace is cluster-
      # scoped, and letting a "no-permission" identity manage its own RBAC
      # would defeat the point of least-privilege), so this can't and
      # shouldn't be reconciled from inside the pipeline itself.

      - name: Check whether the framework image needs rebuilding
        id: image-deps
        run: |
          if git diff --quiet HEAD^ HEAD -- Dockerfile atp.ApiAutomation.Framework/atp.ApiAutomation.Framework.csproj; then
            echo "Dockerfile and .csproj unchanged since last commit, skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dockerfile or .csproj changed, rebuild needed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push framework image (Kaniko)
        if: steps.image-deps.outputs.changed == 'true'
        run: |
          kubectl delete job kaniko-build -n api-automation --ignore-not-found
          kubectl apply -f k8s/kaniko-build-job.yaml
          kubectl wait --for=condition=complete job/kaniko-build -n api-automation --timeout=10m || \
            (kubectl logs job/kaniko-build -n api-automation; exit 1)
          kubectl logs job/kaniko-build -n api-automation

      - name: Deploy Application Under Test
        run: |
          kubectl apply -f k8s/aut-deployment.yaml
          kubectl apply -f k8s/aut-service.yaml
          kubectl wait --for=condition=available deploy/qa-practice-api -n api-automation --timeout=180s || \
            (kubectl describe deploy/qa-practice-api -n api-automation; exit 1)

      - name: Set test credentials
        run: |
          kubectl create secret generic api-creds -n api-automation \
            --from-literal=API_USERNAME="$API_USERNAME" \
            --from-literal=API_PASSWORD="$API_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run tests
        id: run-tests
        run: |
          kubectl delete job run-tests -n api-automation --ignore-not-found
          kubectl apply -f k8s/test-workspace-pvc.yaml
          kubectl apply -f k8s/test-job.yaml

          for i in $(seq 1 180); do
            succeeded=$(kubectl get job run-tests -n api-automation -o jsonpath='{.status.succeeded}')
            failed=$(kubectl get job run-tests -n api-automation -o jsonpath='{.status.failed}')
            [ "$succeeded" = "1" ] || [ "$failed" = "1" ] && break
            sleep 5
          done

          kubectl logs job/run-tests -n api-automation --all-containers

          if [ "$(kubectl get job run-tests -n api-automation -o jsonpath='{.status.succeeded}')" = "1" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retrieve test report
        if: always()
        run: |
          kubectl apply -f k8s/report-retrieval-pod.yaml
          kubectl wait --for=condition=ready pod/report-retrieval -n api-automation --timeout=60s
          kubectl cp api-automation/report-retrieval:/app/atp.ApiAutomation.Framework/bin/Debug/net8.0/TestReport ./TestReport -c retrieval

      - name: Clean up test resources
        if: always()
        run: |
          kubectl delete -f k8s/report-retrieval-pod.yaml -f k8s/test-workspace-pvc.yaml --ignore-not-found

      - name: Tear down Application Under Test
        if: always()
        run: |
          kubectl delete -f k8s/aut-deployment.yaml -f k8s/aut-service.yaml --ignore-not-found

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Upload Extent Report Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./TestReport

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail the workflow if tests failed
        if: steps.run-tests.outputs.passed != 'true'
        run: exit 1
