name: Container Mode Demo

on:
  workflow_dispatch:

jobs:
  kaniko-as-a-declared-container:
    runs-on: talos-runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No kubectl, no Job manifest, no kubectl wait/logs - we just declare
      # the image and args, same as `docker run <image> <args>` would.
      # ARC's containerMode: kubernetes hook creates the pod for this step
      # automatically, behind the scenes.
      - name: Build with Kaniko (declared as a container step)
        uses: docker://ghcr.io/osscontainertools/kaniko:v1.28.4
        with:
          args: >-
            --context=git://github.com/aTapHub/atp.ApiAutomation.Portfolio.git#refs/heads/main
            --dockerfile=Dockerfile
            --no-push
            --verbosity=info
