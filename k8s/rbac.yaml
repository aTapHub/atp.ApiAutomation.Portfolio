# Lets the ARC runner pods (running as talos-runners-gha-rs-no-permission,
# in namespace arc-runners) manage CI-owned resources in api-automation:
# the Kaniko build Job, and the AUT's Deployment/Service (deployed fresh
# per run and torn down afterward).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-job-runner
  namespace: api-automation
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"] # create/delete: the report-retrieval Pod
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"] # needed for `kubectl cp` (implemented over exec) to pull the test report out
  # Scoped to one named Secret so the runner can inject API_USERNAME/PASSWORD
  # into the test Job without being able to read harbor-push-creds or
  # harbor-ca. Caveat: Kubernetes RBAC's resourceNames restriction doesn't
  # apply to "create" (the object doesn't exist yet at authorization time),
  # so this grants create on any Secret name in this namespace - but get/
  # patch/delete stay locked to api-creds specifically, so it can't read or
  # modify either of the other two Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["api-creds"]
    verbs: ["get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-job-runner-binding
  namespace: api-automation
subjects:
  - kind: ServiceAccount
    name: talos-runners-gha-rs-no-permission
    namespace: arc-runners
roleRef:
  kind: Role
  name: ci-job-runner
  apiGroup: rbac.authorization.k8s.io
