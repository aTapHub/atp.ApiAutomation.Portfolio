# Lets the ARC runner pods (running as talos-runners-gha-rs-no-permission,
# in namespace arc-runners) manage the Kaniko build Job in api-automation:
# create it, watch it to completion, and read its logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-job-runner
  namespace: api-automation
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-job-runner-binding
  namespace: api-automation
subjects:
  - kind: ServiceAccount
    name: talos-runners-gha-rs-no-permission
    namespace: arc-runners
roleRef:
  kind: Role
  name: ci-job-runner
  apiGroup: rbac.authorization.k8s.io
