# Lets the ARC runner pods (running as talos-runners-gha-rs-no-permission,
# in namespace arc-runners) manage CI-owned resources in api-automation:
# the Kaniko build Job, and the AUT's Deployment/Service (deployed fresh
# per run and torn down afterward).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-job-runner
  namespace: api-automation
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-job-runner-binding
  namespace: api-automation
subjects:
  - kind: ServiceAccount
    name: talos-runners-gha-rs-no-permission
    namespace: arc-runners
roleRef:
  kind: Role
  name: ci-job-runner
  apiGroup: rbac.authorization.k8s.io
